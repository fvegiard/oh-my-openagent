name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'fvegiard/oh-my-openagent'
    runs-on: ubuntu-latest
    steps:
      - name: Sync dev with upstream
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.mergeUpstream({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "dev",
            });

            core.info(`Sync result: ${data.merge_type} (${data.base_branch})`);
            await core.summary
              .addHeading("Upstream sync")
              .addRaw(`Synced \`${data.base_branch}\` from its configured upstream with a ${data.merge_type} update.`)
              .write();
